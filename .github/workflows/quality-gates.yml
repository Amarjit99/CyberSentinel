name: CyberSentinel quality gates

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install backend dependencies
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - name: Run offline security gate
        run: python scripts/security_gate.py --mode conditional
      - name: Run lint
        run: ruff check apps services tests infrastructure scripts
      - name: Run type checks
        run: mypy apps services scripts
      - name: Run tests
        run: pytest -q
      - name: Verify migration SQL
        run: alembic -c infrastructure/alembic.ini upgrade head --sql

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run build

  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify repository does not contain high-confidence secrets
        shell: bash
        run: |
          set -euo pipefail
          if git grep -n -I -E '-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----|AKIA[0-9A-Z]{16}|gh[pousr]_[A-Za-z0-9]{20,}' -- ':!tests/**' ':!docs/**'; then
            echo "Potential secret detected"
            exit 1
          fi
