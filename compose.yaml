# ==============================================================================
# CyberSentinel AI — Local Development Backing Services
# ==============================================================================
# Canonical Compose specification file (v2 format: compose.yaml).
# For legacy tooling compatibility, docker-compose.yml is maintained in sync.
# ==============================================================================

services:
  postgres:
    image: postgres:16-alpine
    container_name: cybersentinel-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cybersentinel_dev}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_dev_password_change_in_production}
      POSTGRES_DB: ${POSTGRES_DB:-cybersentinel_db}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cybersentinel_dev} -d ${POSTGRES_DB:-cybersentinel_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 256M

  redis:
    image: redis:7-alpine
    container_name: cybersentinel-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          cpus: "0.1"
          memory: 64M

  opensearch:
    image: opensearchproject/opensearch:2.19.0
    container_name: cybersentinel-opensearch
    restart: unless-stopped
    environment:
      discovery.type: single-node
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      DISABLE_SECURITY_PLUGIN: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "127.0.0.1:9200:9200"
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9200/_cluster/health >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 10
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1G
        reservations:
          cpus: "0.5"
          memory: 512M

  web:
    build:
      context: apps/web
      dockerfile: Dockerfile
    container_name: cybersentinel-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:80"
    depends_on:
      api:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          cpus: "0.1"
          memory: 64M

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cybersentinel-api
    restart: unless-stopped
    environment:
      ENVIRONMENT: development
      API_HOST: 0.0.0.0
      API_PORT: 8000
      DATABASE_URL: postgresql://${POSTGRES_USER:-cybersentinel_dev}:${POSTGRES_PASSWORD:-local_dev_password_change_in_production}@postgres:5432/${POSTGRES_DB:-cybersentinel_db}
      LIVE_RESPONSE_DISABLED: "true"
      DRY_RUN_DEFAULT: "true"
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 3
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 768M
        reservations:
          cpus: "0.25"
          memory: 256M

volumes:
  postgres_data:
    name: cybersentinel_postgres_data
  redis_data:
    name: cybersentinel_redis_data
  opensearch_data:
    name: cybersentinel_opensearch_data
