[project]
name = "cybersentinel-ai"
version = "0.1.0"
description = "CyberSentinel AI — Agentic Security Operations & Threat Investigation Platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy>=2.0.35",
    "alembic>=1.13.0",
    "uvicorn[standard]>=0.30.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.1",
    "psycopg[binary]>=3.2.0",
    "redis>=5.0.0",
    "pysigma>=2.0.0",
    "pyyaml>=6.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.7.0",
    "mypy>=1.12.0",
    "bandit>=1.8.0",
    "pip-audit>=2.8.0",
    "cyclonedx-bom>=6.0.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [
    ".venv",
    "build",
    "dist",
    "infrastructure/alembic/versions",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
exclude = [
    "\\.venv",
    "infrastructure/alembic",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
