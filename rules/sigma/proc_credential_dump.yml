title: Memory Credential Dumping Tool Invocation
id: 9c3d4e5f-6a7b-8c9d-0e1f-2a3b4c5d6e7f
status: stable
description: Detects process command lines containing memory credential dumping syntax targeting LSASS or security accounts
references:
    - https://attack.mitre.org/techniques/T1003/001/
author: CyberSentinel Detection Team
date: 2026-10-17
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        command_line|contains:
            - 'sekurlsa'
            - 'logonpasswords'
            - 'comsvcs.dll, MiniDump'
            - 'procdump.exe -ma lsass.exe'
    condition: selection
falsepositives:
    - Authorized penetration testing engagements
level: critical
tags:
    - attack.credential_access
    - attack.t1003.001
